server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;

    # Docker's embedded DNS; refresh instead of keeping a recreated container's old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $assistant_upstream http://assistant:8000;
        proxy_pass $assistant_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        # A RAG request may make several sequential remote model requests.
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }
}
